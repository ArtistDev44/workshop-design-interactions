# Déploiement du site de l'édition (prompt 13).
# Le site Astro est dans site/ et vit à la racine du domaine (base: '/').
# URL canonique : https://workshop-design-interactions.pages.dev/ (Cloudflare Pages).
# ATTENTION (audit prompt 33, 10/11/2026) : ce workflow publie sur GitHub Pages
# (upload-pages-artifact / deploy-pages), pas sur Cloudflare Pages. L'adresse
# GitHub Pages renvoie une 404 : la publication Cloudflare passe par un autre
# mécanisme, non documenté dans le dépôt ([À COMPLÉTER] : intégration Git
# Cloudflare ou dépôt manuel ?). Workflow conservé tel quel en attendant.
name: Déployer le site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # engines de site/package.json (>=22.23.4)
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installer et construire le site
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
