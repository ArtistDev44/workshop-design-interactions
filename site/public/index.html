<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Nantes en régulation — PXE-NTE001-G01-W01</title>
		<meta name="color-scheme" content="dark" />
		<!-- Prompt 27 : fond sombre et écran de chargement posés AVANT tout CSS externe et tout script (aucun flash clair) -->
		<style>
			html, body { margin: 0; background: #0c1016; color: #ffffff; }
			#chargement { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #005ae1; color: #ffffff; font-family: Inter, system-ui, sans-serif; text-align: center; transition: opacity 300ms ease-out; }
			#chargement.masque { opacity: 0; pointer-events: none; }
			#chargement[hidden] { display: none; }
			#chargement .logo { display: block; margin: 0 auto 24px; width: 96px; height: 80px; }
			#chargement .titre { margin: 0; font-size: clamp(28px, 4vw, 56px); font-weight: 700; letter-spacing: -0.01em; }
			#chargement .code { margin: 8px 0 0; font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: clamp(14px, 1.4vw, 20px); }
			#chargement .etat { margin: 28px 0 0; font-size: clamp(14px, 1.4vw, 20px); }
			@media (prefers-reduced-motion: reduce) { #chargement { transition: none; } }
		</style>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<div id="chargement" role="status" aria-live="polite">
			<div>
				<!-- Pictogramme dessiné en SVG inline : un moniteur et une ligne de bus (aucun fichier image) -->
				<svg class="logo" viewBox="0 0 24 20" aria-hidden="true" shape-rendering="crispEdges">
					<rect x="1" y="1" width="22" height="14" fill="#ffffff" />
					<rect x="3" y="3" width="18" height="10" fill="#005ae1" />
					<rect x="4" y="9" width="16" height="1" fill="#ffffff" />
					<rect x="6" y="7" width="3" height="3" fill="#00ca64" />
					<rect x="15" y="7" width="3" height="3" fill="#ffffff" />
					<rect x="11" y="15" width="2" height="3" fill="#ffffff" />
					<rect x="7" y="18" width="10" height="1" fill="#ffffff" />
				</svg>
				<p class="titre">Nantes en régulation</p>
				<p class="code">PXE-NTE001-G01-W01</p>
				<p class="etat" id="chargement-message">Chargement… · Loading…</p>
			</div>
		</div>
		<main id="scene" aria-label="Nantes en régulation — salle de contrôle des transports nantais">
			<noscript>Ce jeu nécessite JavaScript. · This game requires JavaScript.</noscript>
			<p id="annonces" class="sr-only" aria-live="polite"></p>
		</main>

		<!-- Tout est local et relatif : le jeu fonctionne sans réseau et ouvert par double clic. -->
		<script src="./lib/p5.min.js"></script>
		<script src="./data/lignes.js"></script>
		<script src="./data/semaines.js"></script>
		<script src="./data/fallback.js"></script>
		<script src="./data/messages.js"></script>
		<script src="./data/loire.js"></script>
		<script src="./gtfsrt.js"></script>
		<script src="./i18n.js"></script>
		<script src="./sauvegarde.js"></script>
		<script src="./game.js"></script>
		<script src="./confort.js"></script>
		<script src="./sketch.js"></script>
		<script src="./ds.js"></script>
		<script src="./bureau.js"></script>
		<script src="./os.js"></script>
		<script src="./menu.js"></script>
		<script src="./immersion.js"></script>
	</body>
</html>
