<!doctype html>
<html lang="fr">
	<head>

		<style>
			:root { --fond: #0d0c0c; --texte: #ffffff; --doux: rgba(255, 255, 255, 0.75); --accent: #ffffff; }
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); color: var(--texte); font: 1.125rem/1.6 ui-monospace, 'JetBrains Mono', monospace; padding: 16px; }
			main { max-width: 36rem; }
			h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; }
			p { color: var(--doux); margin: 0 0 1.5rem; }
			a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; display: inline-block; padding: 0.5rem 0; }
			a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
		</style>
	</head>

		<main>
