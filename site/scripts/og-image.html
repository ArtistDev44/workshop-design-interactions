<!doctype html>
<!-- Nantes en régulation — gabarit de l'image Open Graph (1200 × 630), rendu par site/scripts/og-image.mjs.
     L'image reprend le style graphique du jeu : la pièce en pixel art (bureau, baie sur la Loire, grue Titan,
     horloge, clavier, téléphone) est le VRAI décor du jeu, capturé par og-image.mjs (tampon 480 × 270 de
     bureau.js) et agrandi × 3 sans lissage. L'écran du PC affiche le titre. Tout le reste vient du dépôt :
     tracés réels des lignes Naolib et de la Loire (data/lignes.json, Open Data Nantes Métropole, Licence
     Ouverte), logo bulle-pin (favicon.svg), couleurs du Pixel Design System, police JetBrains Mono. -->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../public/fonts.css" />
		<style>
			html, body { margin: 0; background: #0d0c0c; }
			canvas { display: block; }
		</style>
	</head>
	<body>
		<canvas id="og" width="1200" height="630"></canvas>
		<script>
			const W = 1200, H = 630;
			const ROUGE = '#D4031C', FOND = '#0D0C0C', BLANC = '#FFFFFF';
			const K = 3; // un pixel du décor = 3 px de l'image
			const CADRE = { x: 40, y: 18, l: W / K, h: H / K }; // partie du décor (480 × 270) gardée
			const ECRAN = { x: 156, y: 46, l: 168, h: 94 }; // ECRAN_PC de bureau.js
			const cv = document.getElementById('og');
			const g = cv.getContext('2d');
			const toile = (l, h) => Object.assign(document.createElement('canvas'), { width: l, height: h });

			/** Texte « pixel » (comme dsTitre, ds.js) : rendu petit, seuillé, à agrandir sans lissage */
			function textePixel(txt, taillePx, couleur) {
				const c = toile(1, 1);
				const k = c.getContext('2d', { willReadFrequently: true });
				k.font = `800 ${taillePx}px "JetBrains Mono"`;
				c.width = Math.ceil(k.measureText(txt).width) + 4;
				c.height = Math.ceil(taillePx * 1.3) + 2;
				k.font = `800 ${taillePx}px "JetBrains Mono"`;
				k.textBaseline = 'top';
				k.fillStyle = '#fff';
				k.fillText(txt, 2, 2);
				const im = k.getImageData(0, 0, c.width, c.height);
				const [r, v, b] = couleur.match(/\w\w/g).map((h) => parseInt(h, 16));
				for (let i = 0; i < im.data.length; i += 4) {
					const plein = im.data[i + 3] > 110;
					im.data[i] = r; im.data[i + 1] = v; im.data[i + 2] = b; im.data[i + 3] = plein ? 255 : 0;
				}
				k.putImageData(im, 0, 0);
				return c;
			}
			/** Logo bulle-pin (favicon.svg), 16 × 15 pixels de côté p */
			function logo(k, x, y, p) {
				const r = (a, b, l, h, c) => ((k.fillStyle = c), k.fillRect(x + a * p, y + b * p, l * p, h * p));
				[[1, 1, 14, 1], [0, 2, 16, 8], [1, 10, 14, 1], [4, 11, 8, 1], [5, 12, 6, 1], [6, 13, 4, 1], [7, 14, 2, 1]].forEach((q) => r(...q, ROUGE));
				[[3, 5, 2, 2], [7, 5, 2, 2], [11, 5, 2, 2]].forEach((q) => r(...q, BLANC));
			}

			/** Contenu de l'écran du PC, dessiné à la résolution du décor (168 × 94) puis agrandi × 3 */
			function ecranPC(L) {
				const c = toile(ECRAN.l, ECRAN.h);
				const k = c.getContext('2d');
				k.fillStyle = FOND;
				k.fillRect(0, 0, c.width, c.height);
				// Carte réelle du réseau, en veilleuse derrière le titre
				const centre = [-1.556, 47.216];
				const kx = Math.cos((centre[1] * Math.PI) / 180);
				const ech = 1500;
				const px = ([lon, lat]) => [c.width * 0.62 + (lon - centre[0]) * kx * ech, c.height / 2 - (lat - centre[1]) * ech];
				const chemin = (pts) => {
					k.beginPath();
					pts.forEach((p, i) => { const [a, b] = px(p); i ? k.lineTo(a, b) : k.moveTo(a, b); });
				};
				k.fillStyle = '#14273c';
				L.eau.forEach((poly) => { chemin(poly); k.closePath(); k.fill(); });
				L.lignes.slice().sort((a, b) => (a.type === 0) - (b.type === 0)).forEach((ln) => {
					const tram = ln.type === 0;
					k.strokeStyle = tram ? ln.couleur || BLANC : BLANC;
					k.globalAlpha = tram ? 1 : 0.1;
					k.lineWidth = 1;
					ln.traces.forEach((t) => { chemin(t); k.stroke(); });
				});
				k.globalAlpha = 1;
				// Voile : la gauche sombre pour le titre
				const gr = k.createLinearGradient(0, 0, c.width, 0);
				gr.addColorStop(0, 'rgba(13,12,12,0.9)');
				gr.addColorStop(0.55, 'rgba(13,12,12,0.6)');
				gr.addColorStop(1, 'rgba(13,12,12,0.1)');
				k.fillStyle = gr;
				k.fillRect(0, 0, c.width, c.height);
				// Titre en pixels, avec un liseré sombre pour rester net sur la carte
				k.imageSmoothingEnabled = false;
				[['NANTES EN', 22], ['RÉGULATION', 47]].forEach(([txt, y]) => {
					const ombre = textePixel(txt, 24, '0D0C0C');
					[[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]].forEach(([dx, dy]) => k.drawImage(ombre, 7 + dx, y + dy));
					k.drawImage(textePixel(txt, 24, 'FFFFFF'), 7, y);
				});
				k.fillStyle = ROUGE;
				k.fillRect(9, 79, 30, 2);
				// Pastille d'incidents en attente, au coin de l'écran (comme en jeu)
				k.fillRect(c.width - 17, 5, 11, 11);
				return c;
			}

			async function dessiner(pieceURL) {
				await document.fonts.load('800 20px "JetBrains Mono"');
				await document.fonts.load('400 20px "JetBrains Mono"');
				const L = await (await fetch('../public/data/lignes.json')).json();
				const piece = new Image();
				piece.src = pieceURL;
				await piece.decode();

				// ——— Le décor du jeu, plein cadre ———
				g.imageSmoothingEnabled = false;
				g.drawImage(piece, CADRE.x, CADRE.y, CADRE.l, CADRE.h, 0, 0, W, H);

				// ——— L'écran du PC ———
				const ex = (ECRAN.x - CADRE.x) * K, ey = (ECRAN.y - CADRE.y) * K;
				g.drawImage(ecranPC(L), ex, ey, ECRAN.l * K, ECRAN.h * K);
				g.imageSmoothingEnabled = true;
				logo(g, ex + 27, ey + 22, 2);
				g.font = '700 15px "JetBrains Mono"';
				g.fillStyle = BLANC;
				g.fillText('PATRIMOINE.EXE · NTE001', ex + 72, ey + 43);
				g.textAlign = 'center';
				g.fillText('3', ex + (ECRAN.l - 11.5) * K, ey + 37);
				g.textAlign = 'left';
				g.font = '400 15px "JetBrains Mono"';
				g.fillText('Une semaine réelle du réseau nantais.', ex + 27, ey + 266);

				// ——— Alertes sur la ville, derrière la baie ———
				[[150, 208], [888, 238]].forEach(([x, y]) => {
					g.fillStyle = 'rgba(13,12,12,0.35)';
					g.fillRect(x + K, y + K, 16 * K, 11 * K);
					logo(g, x, y, K);
				});

				// ——— Accroche, posée sur le plateau ———
				g.font = '400 21px "JetBrains Mono"';
				g.fillStyle = FOND;
				g.fillText('Chaque incident', 44, 532);
				g.fillText('devient un dossier.', 44, 561);
				g.font = '800 21px "JetBrains Mono"';
				g.fillStyle = '#B80218';
				g.fillText('À vous de trancher.', 44, 596);
				g.font = '700 15px "JetBrains Mono"';
				g.fillStyle = FOND;
				g.textAlign = 'right';
				g.fillText('ESD Nantes · B3 Design · 2026', W - 32, 430);
				g.textAlign = 'left';

				g.fillStyle = ROUGE;
				g.fillRect(0, 0, W, 6);
				document.title = 'pret';
			}
		</script>
	</body>
</html>
