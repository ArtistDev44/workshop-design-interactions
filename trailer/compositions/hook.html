<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: var(--fond, #0d0c0c);
      overflow: hidden;
    }
    #hook-gl {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
    #hook-source {
      position: absolute;
      left: 96px;
      bottom: 80px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      line-height: 1.3;
      color: #ffffff;
      background: #0d0c0c;
      padding: 10px 16px;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <canvas id="hook-gl" width="1920" height="1080"></canvas>
    <div id="hook-source" class="clip" data-start="0.1" data-duration="1.7" data-var-text="sourceLignes">
      Tracés réels Naolib · Open Data
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
    (() => {
      // Accent 3D (≤ 2 s) : les tracés RÉELS des lignes Naolib (site/public/data/lignes.json, Open Data Nantes
      // Métropole, Licence Ouverte) s'allument ligne par ligne pendant que la caméra plonge vers le centre-ville.
      // Rendu = fonction pure du temps de la timeline ; aucun hasard ; préparation dans __hf.buildReady.
      const DUREE = 1.86;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#hook-source', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, 0.1);
      tl.to('#hook-source', { opacity: 0, duration: 0.15, ease: 'power3.in' }, 1.6);
      window.__timelines['hook'] = tl;

      const canvas = document.getElementById('hook-gl');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.setClearColor(0x0d0c0c, 1);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.01, 50);
      const lignes = [];
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const pret = fetch('assets/lignes-3d.json')
        .then((r) => r.json())
        .then((d) => {
          const eau = new THREE.LineBasicMaterial({ color: 0x1d3550 });
          for (const t of d.eau) {
            const pts = (Array.isArray(t[0][0]) ? t.flat() : t).map(([x, y]) => new THREE.Vector3(x, 0, -y));
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), eau));
          }
          d.lignes.forEach((l, i) => {
            const tram = l.type === 0;
            const mat = new THREE.LineBasicMaterial({ color: tram ? 0xd4031c : 0xffffff, transparent: !tram, opacity: tram ? 1 : 0.55 });
            for (const tr of l.traces) {
              const pts = tr.map(([x, y]) => new THREE.Vector3(x, tram ? 0.004 : 0, -y));
              const g = new THREE.BufferGeometry().setFromPoints(pts);
              const o = new THREE.Line(g, mat);
              scene.add(o);
              // ordre d'allumage : trams d'abord, puis les autres lignes (indice fixe, pas de hasard)
              lignes.push({ o, n: pts.length, debut: tram ? 0.05 + (i % 3) * 0.06 : 0.25 + ((i * 37) % 96) / 96 * 0.7 });
            }
          });
          renderAt(0);
        });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady['hook-lignes'] = pret;

      function renderAt(t) {
        const k = clamp(t / DUREE, 0, 1);
        const e = easeInOut(k);
        // caméra : de haut et incliné (vue d'ensemble) → plongée vers le centre, plan presque vertical
        const dist = 2.6 - 1.75 * e;
        const tilt = (58 - 40 * e) * (Math.PI / 180);
        camera.position.set(0.02, dist * Math.cos(tilt), dist * Math.sin(tilt));
        camera.lookAt(0.02, 0, -0.02);
        for (const l of lignes) {
          const p = clamp((t - l.debut) / 0.45, 0, 1);
          l.o.geometry.setDrawRange(0, Math.max(0, Math.floor(l.n * p)));
          l.o.visible = p > 0;
        }
        renderer.render(scene, camera);
      }
      window.addEventListener('hf-seek', (ev) => renderAt(ev.detail.time));
    })();
  </script>
</template>
